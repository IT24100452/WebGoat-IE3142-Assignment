name: DevSecOps Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  IMAGE_NAME: ie3142-webgoat

jobs:
  build-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build, test, and package
        run: ./mvnw --batch-mode --no-transfer-progress clean package
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: webgoat-jar
          path: target/webgoat-*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maven-test-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: warn

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep policy gate
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep.yml

  secrets:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency:
    name: Dependency analysis
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Prepare report directory
        run: mkdir -p target
      - name: OWASP Dependency-Check
        if: env.NVD_API_KEY != ''
        run: ./mvnw --batch-mode --no-transfer-progress org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -Dformats=HTML,JSON -DnvdApiKey="$NVD_API_KEY"
      - name: Trivy dependency scan (when NVD API key is unavailable)
        if: env.NVD_API_KEY == ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: target/dependency-trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-scan-report
          path: target/dependency-check-report.*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-dependency-report
          path: target/dependency-trivy.json
          if-no-files-found: ignore

  image:
    name: Container build and Trivy gate
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webgoat-jar
          path: target
      - uses: docker/setup-buildx-action@v3
      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Trivy report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: target/trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload SARIF
        if: success() && hashFiles('target/trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/trivy-results.sarif
      - name: Trivy blocking gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  policy:
    name: Required security policy
    if: always()
    needs: [build-test, sast, secrets, dependency, image]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required jobs
        run: |
          test "${{ needs.build-test.result }}" = success
          test "${{ needs.sast.result }}" = success
          test "${{ needs.secrets.result }}" = success
          test "${{ needs.dependency.result }}" = success
          test "${{ needs.image.result }}" = success
