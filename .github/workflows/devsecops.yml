 
# DevSecOps Pipeline for IE3142 WebGoat Assignment
# This workflow runs automatically on every push and pull request to main/develop
# It performs security checks and automated testing

name: DevSecOps Pipeline

on:
  # Trigger on push to main, develop, or any feature/* branch
  push:
    branches: [main, develop, "feature/**"]
  # Trigger on pull requests to main or develop
  pull_request:
    branches: [main, develop]
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# Minimal permissions: give jobs only what they need (principle of least privilege)
permissions:
  contents: read              # Can read code
  security-events: write      # Can upload security scan results
  actions: read               # Can read workflow status

# Prevent multiple runs of this workflow on the same branch
concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  IMAGE_NAME: ie3142-webgoat

jobs:
  # JOB 1: Build and run unit tests
  build-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # Step 1: Download the code from the repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history for analysis
      # Step 2: Install Java (required for building)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven  # Cache Maven dependencies to speed up builds
      # Step 3: Compile and test the application
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean test
      # Step 4: Save test results as artifacts (visible in GitHub UI)
      - name: Upload test reports
        if: always()  # Run even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: warn