rules:
  - id: ie3142-java-sql-string-concatenation
    message: Untrusted values must not be concatenated into SQL; use bound parameters.
    severity: ERROR
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: $S.executeQuery($Q + $X)
          - pattern: $S.executeUpdate($Q + $X)
          - pattern: $S.prepareStatement($Q + $X)
    paths:
      exclude:
        - "**/lessons/challenges/**"
        - "**/lessons/sqlinjection/**"
  - id: ie3142-java-runtime-exec
    message: Avoid command execution with user-controlled values.
    severity: ERROR
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec(...)
          - pattern: new ProcessBuilder(...)
    paths:
      exclude:
        - "**/org/dummy/insecure/framework/**"
  - id: ie3142-hardcoded-password
    message: Do not hardcode passwords. Inject secrets at runtime.
    severity: ERROR
    languages: [java]
    pattern-regex: '(?i)(password|passwd|pwd)\s*=\s*"[^"${}]{8,}"'
    paths:
      exclude:
        - "**/src/test/**"
        - "**/src/it/**"
        - "**/target/**"
        - "**/org/dummy/insecure/framework/**"
        - "**/lessons/challenges/**"
        - "**/lessons/jwt/JWTRefreshEndpoint.java"
